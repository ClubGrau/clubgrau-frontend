# Deploy de produção no Netlify quando uma pull request para a main é aprovada.
# O GitHub só dispara este evento com o workflow já presente na branch default.
#
# Secrets obrigatórios (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  — token pessoal em Netlify → User settings → Applications
#   NETLIFY_SITE_ID     — Site configuration → Site details → Site ID
#   VITE_API_BASE_URL   — URL da API de produção (o Vite embute isso no build)

name: Deploy to Netlify

on:
  pull_request_review:
    types: [submitted]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Secret VITE_API_BASE_URL is required."
            exit 1
          fi
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.10.0 deploy --prod --dir=dist --message "$DEPLOY_MESSAGE"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: Deploy ${{ github.event.pull_request.head.sha || github.sha }}
